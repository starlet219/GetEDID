name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Restore NuGet packages
        shell: pwsh
        run: |
          nuget restore GetEDID.sln -PackagesDirectory packages
      - name: Build x64 Release
        shell: pwsh
        run: |
          msbuild GetEDID.sln /m /p:Configuration=Release /p:Platform=x64 /p:WindowsTargetPlatformVersion=10.0.22621.0
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: GetEDID-Windows-x64
          path: |
            **/x64/Release/GetEDID.exe
            **/Release/GetEDID.exe
          if-no-files-found: error
